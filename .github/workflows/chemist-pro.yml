name: Chemist Pro CI

on:
  push:
    branches: [main, "feature/chemist-pro-foundation"]
    paths:
      - "apps/chemist-pro/**"
      - ".github/workflows/chemist-pro.yml"
  pull_request:
    paths:
      - "apps/chemist-pro/**"
      - ".github/workflows/chemist-pro.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chemist-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
