name: TDBK Browser Lab
on:
  push:
    branches: [main, "feat/tdbk-browser-lab-v1"]
    paths:
      - "lab/browser-automation/**"
      - "src/platform/agent/**"
      - "vitest.config.ts"
      - "server.ts"
      - "tsconfig.json"
      - ".github/workflows/browser-lab.yml"
  pull_request:
    paths:
      - "lab/browser-automation/**"
      - "src/platform/agent/tools/browserAutomationTool.ts"
      - "server.ts"
      - "tsconfig.json"
      - ".github/workflows/browser-lab.yml"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab/browser-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck

  tdbk-integration-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
