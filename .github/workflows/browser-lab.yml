name: TDBK Browser Lab
on:
  push:
    branches: [main, "feat/tdbk-browser-lab-v1"]
    paths:
      - "lab/browser-automation/**"
      - ".github/workflows/browser-lab.yml"
  pull_request:
    paths:
      - "lab/browser-automation/**"
      - ".github/workflows/browser-lab.yml"
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab/browser-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
