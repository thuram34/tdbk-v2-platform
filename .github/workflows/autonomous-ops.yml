name: TDBK Autonomous Operations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["TDBK V2 CI"]
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect triggering CI run
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "CI run: $RUN_ID"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Retry failed CI jobs once
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"

      - name: Record unresolved CI failure without duplicate issues
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="Autonomous Ops: CI failure requires engineering action"
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="$(printf '%s\\n' "TDBK CI remains failed after its one automatic retry." "" "- Run ID: $RUN_ID" "- Workflow: $RUN_NAME" "- Branch: $RUN_BRANCH" "- Commit: $RUN_SHA" "- Run: $RUN_URL" "" "Review the failing job logs and record the root cause before any production change.")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Report healthy completion
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: echo "TDBK CI is healthy. No repair action required."

      - name: Scheduled control-plane checkpoint
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: echo "Scheduled TDBK operations checkpoint completed; runtime mutation remains authorization-gated."
