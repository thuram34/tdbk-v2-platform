name: TDBK V2 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate production Docker image
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY=ci-placeholder \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com \
            --build-arg VITE_FIREBASE_PROJECT_ID=ci-placeholder \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=ci-placeholder.firebasestorage.app \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000 \
            --build-arg VITE_FIREBASE_APP_ID=ci-placeholder \
            -t tdbk-v2-ci .
