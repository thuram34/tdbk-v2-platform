name: TDBK V2 CI

# Deterministic verification only: CI must never mutate or push source files.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci must use the committed lockfile exactly. If it is stale or invalid,
      # fail visibly and fix package.json/package-lock.json in a reviewed commit.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Capability engineering gate
        run: npm run test:capabilities

      - name: Flow orchestration gate
        run: npm run test:flow

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate production Docker image
        run: |
          docker build \\
            --build-arg VITE_FIREBASE_API_KEY=ci-placeholder \\
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com \\
            --build-arg VITE_FIREBASE_PROJECT_ID=ci-placeholder \\
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=ci-placeholder.firebasestorage.app \\
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000 \\
            --build-arg VITE_FIREBASE_APP_ID=ci-placeholder \\
            -t tdbk-v2-ci .
