name: TDBK Experience Studio Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/tdbk-configurable-experience-studio

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
